        <script>
        (function () {
          const container = document.getElementById('iconRain');
        
          // Cấu hình
          const CONFIG = {
            ICONS: ['❤️' , '💕'],
            MIN_SIZE: 10,
            MAX_SIZE: 25,
            MIN_DURATION: 6,
            MAX_DURATION: 12,
            SPAWN_INTERVAL: 1000,
            MAX_DROPS: 200 
          };
      
          let timer = null;
          let totalDrops = 0;
      
          function rand(min, max) {
            return Math.random() * (max - min) + min;
          }
      
          function spawnOne() {
            if (totalDrops >= CONFIG.MAX_DROPS) return;
        
            const drop = document.createElement('div');
            drop.className = 'icon-drop';
        
            // Chọn icon (emoji). Nếu muốn 1 icon cố định thì dùng: const icon = '⭐';
            const icon = CONFIG.ICONS[Math.floor(Math.random() * CONFIG.ICONS.length)];
            drop.textContent = icon;
        
            // Random vị trí ngang, kích thước, thời gian rơi, delay
            const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
            const x = Math.floor(rand(0, vw));              // px ngang
            const size = Math.floor(rand(CONFIG.MIN_SIZE, CONFIG.MAX_SIZE)); // px
            const dur = rand(CONFIG.MIN_DURATION, CONFIG.MAX_DURATION); // s
            const delay = rand(0, 1.2);                     // s
        
            // Set style nhanh
            drop.style.left = x + 'px';
            drop.style.fontSize = size + 'px';
            drop.style.animationDuration = dur + 's';
            drop.style.animationDelay = delay + 's';
        
            // Thêm vào DOM
            container.appendChild(drop);
            totalDrops++;
        
            // Khi animation kết thúc → xoá để tránh đầy DOM
            const remove = () => {
              drop.remove();
              totalDrops--;
            };
            drop.addEventListener('animationend', remove, { once: true });
          }
      
          function start() {
            if (timer) return;
            // Spawn “burst” đầu để thấy ngay
            for (let i = 0; i < 20; i++) spawnOne();
            timer = setInterval(spawnOne, CONFIG.SPAWN_INTERVAL);
          }
      
          function stop() {
            if (timer) {
              clearInterval(timer);
              timer = null;
            }
            // Xoá tất cả hạt hiện có
            container.querySelectorAll('.icon-drop').forEach(e => e.remove());
            totalDrops = 0;
          }

          start();
      
          // Tối ưu: tạm dừng khi tab ẩn
          document.addEventListener('visibilitychange', () => {
            if (document.hidden) stop();
            else start();
          });
        })();
    </script>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
      const lazyBackgrounds = document.querySelectorAll("[data-bg]");

      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const el = entry.target;
            el.style.backgroundImage = `url(${el.getAttribute("data-bg")})`;
            el.removeAttribute("data-bg"); // tránh load lại
            observer.unobserve(el);
          }
        });
      });

      lazyBackgrounds.forEach(el => observer.observe(el));
    });
    </script>
